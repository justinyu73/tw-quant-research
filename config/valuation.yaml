schema: tqr-scenario-valuation/v1
fair_value:
  formula: "scenario_eps * scenario_pe"
  scenarios: [bear, base, bull]
  base_is_authoritative: true
buy_zone_ratios:
  watch: 0.90
  first: 0.85
  second: 0.80
  sweet: 0.75
  extreme: 0.65
buy_zone_note: "ratios are relative to the base fair value and are user-editable per company"
required_basis_fields:
  - eps_period
  - eps_kind
  - pe_rationale
  - financial_data_date
  - valuation_date
  - change_reason
required_data_controls:
  - split_adjustment
  - dividend_adjustment
  - share_count_change
  - eps_definition_consistency
  - one_off_earnings_review
